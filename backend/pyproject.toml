[project]
name = "ai-modelops-platform-backend"
version = "0.1.0"
description = "Backend Flask + MLOps + LLMOps de AI ModelOps Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Flask / API
    "flask>=3.0",
    "flask-smorest>=0.44",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-jwt-extended>=4.6",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    # MLOps
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "mlflow>=2.10",
    # LLMOps
    "langchain>=0.2",
    # Tests
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
